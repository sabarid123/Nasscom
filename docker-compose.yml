version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: stock_trading_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: stock_trading_db
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: stock_trading_server
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/stock_trading_db
      JWT_SECRET: supersecretjwtkey_production_ready_2026
      JWT_REFRESH_SECRET: supersecretjwtrefreshkey_production_ready_2026
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: stock_trading_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
